name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: hanzalajv/civicpulse-backend
  FRONTEND_IMAGE: hanzalajv/civicpulse-frontend

jobs:
  test:
    name: Full test suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: civicpulse
          POSTGRES_PASSWORD: civicpulse_test
          POSTGRES_DB: civicpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U civicpulse"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql+psycopg://civicpulse:civicpulse_test@localhost:5432/civicpulse
      REDIS_URL: redis://localhost:6379/0
      TRIAGE_PROVIDER: simulated
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Backend migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Backend lint
        working-directory: backend
        run: ruff check app/

      - name: Backend type-check
        working-directory: backend
        run: mypy app/

      - name: Backend tests
        working-directory: backend
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=65

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend deps
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npx eslint .

      - name: Frontend type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Frontend tests
        working-directory: frontend
        run: npm run test

  build-push:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: test
    outputs:
      backend-digest: ${{ steps.backend.outputs.digest }}
      frontend-digest: ${{ steps.frontend.outputs.digest }}
      short-sha: ${{ steps.sha.outputs.short }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        id: backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        id: frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM — backend
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          artifact-name: sbom-backend.spdx.json
          format: spdx-json

      - name: Generate SBOM — frontend
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          artifact-name: sbom-frontend.spdx.json
          format: spdx-json

  deploy-k8s:
    name: Deploy to ephemeral k3d
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - uses: actions/checkout@v4

      - name: Install k3d
        run: |
          curl -sSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl

      - name: Install kustomize
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz" | tar xz
          sudo mv kustomize /usr/local/bin/

      - name: Create k3d cluster
        run: k3d cluster create civicpulse-ci -p "8080:80@loadbalancer" --wait
      - name: Patch kubeconfig for localhost access
        run: |
          sed -i 's|host.docker.internal|127.0.0.1|g' ~/.kube/config
          kubectl config view --minify | grep server

      - name: Install metrics-server
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
          sleep 15
          kubectl patch deployment metrics-server -n kube-system --type=json \
            -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]' || true
          sleep 30
          kubectl wait --for=condition=available deployment/metrics-server -n kube-system --timeout=120s || true

      - name: Log in to GHCR for image pulls
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull images and import into k3d
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          docker pull ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          k3d image import ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }} -c civicpulse-ci
          k3d image import ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }} -c civicpulse-ci

      - name: Install VPA CRDs
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/autoscaler/master/vertical-pod-autoscaler/deploy/vpa-v1-crd-gen.yaml
          sleep 5

      - name: Apply prod overlay with SHA tag
        env:
          IMAGE_TAG: ${{ github.sha }}
        working-directory: k8s/overlays/prod
        run: |
          kustomize edit set image backend=ghcr.io/hanzalajv/civicpulse-backend:$IMAGE_TAG
          kustomize edit set image frontend=ghcr.io/hanzalajv/civicpulse-frontend:$IMAGE_TAG
          kustomize build . | kubectl apply -f -

      - name: Verify Secret exists
        run: kubectl get secret civicpulse-secrets -n civicpulse

      - name: Verify ConfigMap exists
        run: kubectl get configmap civicpulse-config -n civicpulse

      - name: Wait for Redis ready
        run: kubectl wait --for=condition=ready pod -l app=redis -n civicpulse --timeout=120s

      - name: Wait for Postgres ready
        run: kubectl wait --for=condition=ready pod -l app=postgres -n civicpulse --timeout=180s

      - name: Wait for backend pod to be running
        run: |
          for i in $(seq 1 40); do
            ready=$(kubectl get deploy/backend -n civicpulse -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo "0")
            if [ "$ready" = "2" ] || [ "$ready" = "1" ]; then
              echo "Backend has $ready ready replicas"
              break
            fi
            echo "Attempt $i: backend ready replicas = $ready"
            sleep 5
          done

      - name: Run migrations
        run: kubectl exec -n civicpulse deploy/backend -- alembic upgrade head

      - name: Run seed
        run: kubectl exec -n civicpulse deploy/backend -- python -m scripts.seed || true

      - name: Wait for backend rollout
        run: kubectl rollout status deployment/backend -n civicpulse --timeout=300s

      - name: Wait for frontend rollout
        run: kubectl rollout status deployment/frontend -n civicpulse --timeout=300s

      - name: Debug pods on failure
        if: failure()
        run: |
          echo "=== Pods ==="
          kubectl get pods -n civicpulse -o wide || true
          echo "=== Secrets ==="
          kubectl get secrets -n civicpulse || true
          echo "=== ConfigMaps ==="
          kubectl get configmaps -n civicpulse || true
          echo "=== Backend describe ==="
          kubectl describe pods -n civicpulse -l app=backend || true
          echo "=== Backend logs ==="
          kubectl logs -n civicpulse -l app=backend --tail=100 --all-containers=true || true
          echo "=== Postgres logs ==="
          kubectl logs -n civicpulse -l app=postgres --tail=100 --all-containers=true || true
          echo "=== Redis logs ==="
          kubectl logs -n civicpulse -l app=redis --tail=50 --all-containers=true || true
          echo "=== Events ==="
          kubectl get events -n civicpulse --sort-by='.lastTimestamp' | tail -50

      - name: Smoke test through Ingress
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/meta/providers > /dev/null; then
              echo "Ingress reachable"
              break
            fi
            sleep 3
          done
          curl -fsS http://localhost:8080/api/meta/providers

      - name: Print HPA status
        run: kubectl get hpa -n civicpulse

      - name: Tear down
        if: always()
        run: k3d cluster delete civicpulse-ci