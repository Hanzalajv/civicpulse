name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  lint-and-type:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Ruff (backend)
        working-directory: backend
        run: ruff check app/

      - name: Mypy (backend)
        working-directory: backend
        run: mypy app/ --ignore-missing-imports || true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: ESLint (frontend)
        working-directory: frontend
        run: npm run lint

      - name: TypeScript (frontend)
        working-directory: frontend
        run: npm run typecheck

  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: civicpulse
          POSTGRES_PASSWORD: civicpulse_test
          POSTGRES_DB: civicpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U civicpulse"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql+psycopg://civicpulse:civicpulse_test@localhost:5432/civicpulse
      REDIS_URL: redis://localhost:6379/0
      TRIAGE_PROVIDER: simulated
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Run tests with coverage
        working-directory: backend
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=65

  test-frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm run test

  build:
    name: Build images
    runs-on: ubuntu-latest
    needs: [lint-and-type, test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          load: true
          tags: civicpulse-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          load: true
          tags: civicpulse-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scan:
    name: Trivy scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend for scanning
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          load: true
          tags: civicpulse-backend:scan

      - name: Build frontend for scanning
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          load: true
          tags: civicpulse-frontend:scan

      - name: Trivy — backend
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: civicpulse-backend:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Trivy — frontend
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: civicpulse-frontend:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  manifests:
    name: Validate K8s manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Install kustomize
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" | tar xz
          sudo mv kustomize /usr/local/bin/

      - name: Build prod overlay
        run: kustomize build k8s/overlays/prod > /tmp/prod.yaml

      - name: Validate with kubeconform
        run: kubeconform -strict -summary -ignore-missing-schemas /tmp/prod.yaml

  integration:
    name: Compose integration smoke
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Create .env for integration
        run: |
          cat > .env <<EOF
          POSTGRES_USER=civicpulse
          POSTGRES_PASSWORD=civicpulse_test
          POSTGRES_DB=civicpulse
          TRIAGE_PROVIDER=simulated
          GROQ_API_KEY=
          GEMINI_API_KEY=
          EOF

      - name: Build and start stack
        run: docker compose -f compose.yaml up -d --build

      - name: Wait for backend readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/ready > /dev/null; then
              echo "Backend ready"
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to become ready"
          docker compose -f compose.yaml logs backend
          exit 1

      - name: Run migrations
        run: docker compose -f compose.yaml exec -T backend alembic upgrade head

      - name: POST a complaint
        run: |
          curl -fsS -X POST http://localhost:8000/api/complaints \
            -H "Content-Type: application/json" \
            -d '{"text":"Burst water pipe on Street 99 flooding","location":"Street 99"}' \
            -o /tmp/created.json
          cat /tmp/created.json

      - name: Assert category is water
        run: |
          python - <<'PY'
          import json, sys
          data = json.load(open("/tmp/created.json"))
          assert data["category"] == "water", f"Expected water, got {data['category']}"
          assert data["priority"] == "high", f"Expected high, got {data['priority']}"
          print("Complaint asserted OK")
          PY

      - name: Stats MISS then HIT
        run: |
          first=$(curl -si http://localhost:8000/api/stats | tr -d '\r' | grep -i '^x-cache:' | awk '{print $2}')
          second=$(curl -si http://localhost:8000/api/stats | tr -d '\r' | grep -i '^x-cache:' | awk '{print $2}')
          echo "First: $first, Second: $second"
          test "$first" = "MISS"
          test "$second" = "HIT"

      - name: Tear down
        if: always()
        run: docker compose -f compose.yaml down -v