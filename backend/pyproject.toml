[project]
name = "civicpulse-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy",
    "alembic",
    "psycopg[binary]",
    "redis",
    "httpx",
    "python-json-logger",
    "prometheus-client",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "pytest-asyncio", "fakeredis"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
]

ignore = [
    "E501",   # line too long — handled by formatter
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "BLE001", # catching Exception is intentional fallback behavior
    "RUF012", # class-level mutable defaults are intentional dicts/lists
    "EXE002", # executable file without shebang — a Windows artifact
    "UP042",  # (str, Enum) is fine; StrEnum breaks SQLAlchemy enum mapping
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # allow re-exports

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# Strict mode disabled — code has partial annotations.
# Errors are still reported in CI logs but don't block the pipeline.
disable_error_code = [
    "no-untyped-def",
    "type-arg",
    "var-annotated",
    "no-any-return",
    "return-value",
    "union-attr",
    "valid-type",
    "misc",
    "arg-type",
    "call-arg",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=65"